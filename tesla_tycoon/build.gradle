plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    // Client-only code lives in src/client/java so the common jar can never touch client classes
    // (a dedicated server would crash on them).
    splitEnvironmentSourceSets()

    mods {
        "tesla_tycoon" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        // ./gradlew runGametest  - runs every Tesla Tycoon game test on a headless server and exits.
        // (accept the Minecraft EULA once by putting eula=true into build/gametest/eula.txt)
        gametest {
            inherit server
            name "Tesla Tycoon Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get().asFile}/junit.xml"
            runDir "build/gametest"
        }

        // ./gradlew runClient -PttQuickPlay=<world folder name>  jumps straight into a singleplayer world.
        client {
            if (project.hasProperty('ttQuickPlay')) {
                programArgs '--quickPlaySingleplayer', project.property('ttQuickPlay')
            }
        }
    }
}

// every game test run starts in a fresh world (leftovers of earlier runs must not influence the results)
tasks.configureEach { task ->
    if (task.name == "runGametest") {
        task.doFirst { delete layout.buildDirectory.dir("gametest/world") }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // offline speech recognition for the push-to-talk voice chat (whisper.cpp + natives for Windows / macOS / Linux, 4.6 MB),
    // shipped inside the mod jar
    implementation "io.github.givimad:whisper-jni:1.7.1"
    include "io.github.givimad:whisper-jni:1.7.1"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
